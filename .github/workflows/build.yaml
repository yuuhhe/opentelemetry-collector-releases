name: Build Custom otelcol-contrib

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your custom repo
        uses: actions/checkout@v4

      - name: Checkout your patched contrib fork
        uses: actions/checkout@v4
        with:
          repository: yuuhhe/opentelemetry-collector-contrib   # ← 改成你 fork 的地址
          ref: patch-ClientDropP0s
          path: contrib-fork

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'   # datadogreceiver 当前要求 1.25

      - name: Install OCB (OpenTelemetry Collector Builder)
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.150.0

      - name: Build custom collector
        run: |
          builder --config manifest.yaml

      - name: Upload binary (Linux amd64)
        uses: actions/upload-artifact@v4
        with:
          name: otelcol-contrib-linux-amd64
          path: ./_build/otelcol-contrib   # 文件名和 dist.name 一致
